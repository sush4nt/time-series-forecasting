[project]
name = "assignment-ml-engineer-v3"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "catboost~=1.2.5",
    "fastapi~=0.110.0",
    "httpx~=0.27.0",
    "lightgbm~=4.3.0",
    "mlflow~=2.11.0",
    "numpy~=1.26.0",
    "onnxconverter-common~=1.14.0",
    "onnxmltools~=1.12.0",
    "onnxruntime~=1.17.0",
    "pandas~=2.2.0",
    "prometheus-client~=0.20.0",
    "pyarrow~=15.0.0",
    "pydantic~=2.6.0",
    "pyyaml~=6.0",
    "scikit-learn~=1.4.0",
    "setuptools>=69,<81",
    "torch~=2.2.0",
    "uvicorn[standard]~=0.29.0",
    "xgboost~=2.0.3",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "seaborn>=0.13.2",
]
